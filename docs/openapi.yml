openapi: 3.0.3
info:
  title: Beauty of Strength API
  description: |
    API for the Beauty of Strength fitness platform.

    A white-label platform connecting instructors (professors) and students
    for workout planifications, routines, and training execution.
  version: 0.1.0
  contact:
    name: Beauty of Strength Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3001/api
    description: Local development server
  - url: https://bos.team/api
    description: Production server

tags:
  - name: Health
    description: Health check and version endpoints
  - name: Authentication
    description: User authentication and authorization
  - name: Planifications
    description: Workout planification management
  - name: Routines
    description: Routine and exercise management
  - name: Users
    description: User profile and account management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API and database are operational
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /version:
    get:
      tags:
        - Health
      summary: Get version information
      description: Returns the current API version and build information
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /googlesignin:
    post:
      tags:
        - Authentication
      summary: Google OAuth sign in
      description: Authenticate user with Google OAuth token
      operationId: googleSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Google OAuth ID token
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Service health status
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
        database:
          type: string
          enum: [ok, error]
          description: Database connection status

    VersionResponse:
      type: object
      properties:
        version:
          type: string
          example: "0.1.0"
          description: API version
        buildDate:
          type: string
          format: date
          example: "2025-01-04"
          description: Build date
        goVersion:
          type: string
          example: "1.20"
          description: Go version used

    AuthResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User ID
        email:
          type: string
          format: email
          description: User email
        accountType:
          type: string
          enum: [Professor, StudentFree, StudentPremium]
          description: Account type
        token:
          type: string
          description: Session token

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

security:
  - cookieAuth: []
